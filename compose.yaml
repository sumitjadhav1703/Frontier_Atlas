services:
  postgres:
    # pgvector build of Postgres 16: migration 009 needs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal_fixture
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_fixture"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - signal_pg_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  signal_pg_data:
