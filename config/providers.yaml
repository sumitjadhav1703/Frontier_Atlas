# Provider capability stubs for B4+. Secrets via environment / OS keychain only.
# Model IDs are placeholders until B8 live qualification. Fake never counts as live.

defaults:
  # User decision 2026-11-23: up to $5 of the user's Meta Model API credits may be spent
  # (only the meta tier is billed; every other tier stays free/local).
  paid_spend_cap: 5
  network_mode: offline
  # Model IDs stay placeholders until B8. Absent credentials disable a tier.

providers:
  fake:
    provider: fake
    model: fake-extract-v1
    enabled: true
    context_tokens: 8192
    reserved_output_tokens: 1024
    max_input_tokens: 6912
    max_request_bytes: 200000
    safety_margin_tokens: 64
    framing_tokens: 256
    api_key_env: null
    billing_enabled: false
    is_fake: true
    # Fake never qualifies as live.

  gemini:
    provider: gemini
    # B8 2026-11-22: model listed live via /v1beta/models; free tier, no billing.
    litellm_model: gemini/gemini-2.5-flash
    model: gemini-2.5-flash
    enabled: true
    # Thinking tokens count against max_tokens and truncated the JSON in the live smoke.
    litellm_params:
      reasoning_effort: disable
    context_tokens: 1048576
    reserved_output_tokens: 2048
    max_input_tokens: 1000000
    max_request_bytes: 2000000
    safety_margin_tokens: 256
    framing_tokens: 512
    api_key_env: GEMINI_API_KEY
    billing_enabled: false
    # Conservative free-tier daily caps (local ledger stops before the provider does).
    requests_per_day: 200
    tokens_per_day: 1000000

  groq:
    provider: groq
    # B8 2026-11-22: llama-3.3-70b-versatile is no longer served; gpt-oss-120b listed live.
    # Free tier measured: 8000 tokens/minute, 1000 requests/day. A request above the
    # per-minute token limit is a real 413, so input is capped well below 8000.
    litellm_model: groq/openai/gpt-oss-120b
    model: openai/gpt-oss-120b
    enabled: true
    context_tokens: 131072
    reserved_output_tokens: 1024
    max_input_tokens: 5500
    max_request_bytes: 120000
    safety_margin_tokens: 128
    framing_tokens: 512
    api_key_env: GROQ_API_KEY
    billing_enabled: false
    requests_per_day: 900
    tokens_per_day: 200000

  meta:
    # Meta Model API (dev.meta.ai), OpenAI-compatible. Cheapest standard model; content is
    # not used for training (the "-contributor" variants would allow that, so not used).
    provider: meta
    litellm_model: openai/muse-ember-1.0
    model: muse-ember-1.0
    enabled: true
    base_url: https://api.meta.ai/v1
    api_key_env: MODEL_API_KEY
    context_tokens: 1048576
    reserved_output_tokens: 2048
    max_input_tokens: 200000
    max_request_bytes: 2000000
    safety_margin_tokens: 256
    framing_tokens: 512
    billing_enabled: true
    # Ember always reasons (default effort "max"; "none" is rejected), and reasoning eats
    # output tokens: the first live smoke used all 1024 and returned no answer.
    litellm_params:
      reasoning_effort: minimal
    usd_per_m_input: 0.10
    usd_per_m_output: 0.50
    requests_per_day: 3000
    tokens_per_day: 20000000

  ollama:
    provider: ollama
    litellm_model: ollama_chat/llama3.2:3b
    model: PLACEHOLDER_LOCAL
    enabled: false
    context_tokens: 8192
    reserved_output_tokens: 1024
    max_input_tokens: 6912
    max_request_bytes: 200000
    safety_margin_tokens: 64
    framing_tokens: 256
    api_key_env: null
    billing_enabled: false
    is_local: true
    base_url: http://127.0.0.1:11434
    requests_per_day: 100000
    tokens_per_day: 100000000
