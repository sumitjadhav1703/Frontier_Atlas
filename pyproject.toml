[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-ingest"
version = "0.1.0"
description = "AI Signal ingestion pipeline (assessment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary,pool]>=3.1,<4",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
  # R3: relative/locale dates, full-text article extraction, public-suffix domains.
  "dateparser==1.5.0",
  "trafilatura==2.3.1",
  "tldextract==5.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
signal-ingest = "signal_ingest.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]
